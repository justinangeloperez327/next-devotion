name: Generate Release Artifacts

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-release-artifacts.yml"

permissions:
  contents: write

jobs:
  generate:
    name: Generate lockfile and initial migration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate initial Prisma migration
        run: |
          mkdir -p prisma/migrations/0_init
          npx prisma migrate diff \
            --from-empty \
            --to-schema prisma/schema.prisma \
            --script \
            --output prisma/migrations/0_init/migration.sql

      - name: Validate generated artifacts
        run: |
          test -f package-lock.json
          test -s prisma/migrations/0_init/migration.sql
          npm run db:validate

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json prisma/migrations/0_init/migration.sql
          if git diff --cached --quiet; then
            echo "Release artifacts are already current."
            exit 0
          fi
          git commit -m "build: add lockfile and initial Prisma migration"
          git push

name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/next_devotion?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Check release configuration
        run: npm run deployment:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Audit production dependencies
        run: npm run security:audit

  public-e2e:
    name: Browser and authentication tests
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: next_devotion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_AUTH_ENABLED: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/next_devotion?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply test database migrations
        run: npm run db:deploy

      - name: Check applied migration status
        run: npm run db:status

      - name: Run public and authentication browser tests
        run: npm run test:e2e -- tests/e2e/public.spec.ts tests/e2e/auth-lifecycle.spec.ts tests/e2e/appearance.spec.ts

      - name: Upload browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-test-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
